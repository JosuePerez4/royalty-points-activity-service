# CORS (variables de entorno): patrones coma-separados + orígenes exactos opcionales
FRONTEND_CORS_PATTERNS: "${FRONTEND_CORS_PATTERNS:https://*.vercel.app,https://*.up.railway.app,http://localhost:*,http://127.0.0.1:*}"
FRONTEND_URL: "${FRONTEND_URL:}"

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:puntos-lealtad-service}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5671}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED:true}

server:
  port: ${PORT:${SERVER_PORT:8081}}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.lealtad: ${LOGGING_LEVEL_COM_LEALTAD:DEBUG}
    org.springframework.amqp: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AMQP:DEBUG}
