# Sin valores por defecto de infraestructura: datasource/RabbitMQ/etc. vienen del SO o del .env
# (ver PuntosLealtadApplication). En contenedores normalmente no hay .env: define las vars en el proveedor.
# open-in-view tiene fallback false para no exigir otra variable solo en despliegue.
# No declares aquí ${FRONTEND_CORS_PATTERNS:...}: puede producir referencia circular.

spring:
  application:
    name: ${SPRING_APPLICATION_NAME}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    show-sql: ${SPRING_JPA_SHOW_SQL}
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL_ENABLED}

server:
  port: ${PORT:${SERVER_PORT}}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT}
    com.lealtad: ${LOGGING_LEVEL_COM_LEALTAD}
    org.springframework.amqp: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_AMQP}
